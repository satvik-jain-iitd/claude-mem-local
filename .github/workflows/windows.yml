name: Windows

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plugin/scripts/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'package.json'
      - 'bunfig.toml'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]


# A newer push to the same branch or PR cancels the older run: its result is
# already out of date. 174 of 224 CI push runs on main (Nov 1-7) were superseded
# yet ran to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned to windows-2022 (VS2022 / v17). The windows-latest image moved to
    # windows-2025, which ships Visual Studio 18 — npm's bundled node-gyp@11.5.0
    # can't detect it ("unknown version undefined") and native tree-sitter
    # rebuilds fail during `npm install`. Revisit when node-gyp gains VS18 support.
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun (worker runtime)
        run: |
          irm https://bun.sh/install.ps1 | iex
        shell: pwsh

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Hook compatibility with Git Bash and Windows overrides
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\bin\bun.exe'
          & $bun test tests/infrastructure/hook-shell.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bun test tests/infrastructure/plugin-distribution.test.ts --test-name-pattern 'Codex Windows payload dependency check'

      - name: Path and executable assertions
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\bin\bun.exe'
          & $bun test tests/services/smart-file-read/path-search.test.ts tests/services/agent-runner/detect.test.ts tests/services/integrations/spawn-contract-windows.test.ts tests/antigravity-cli-compat.test.ts --timeout 120000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bun test tests/work-view/request-first.test.ts --test-name-pattern 'built request-progress skill'

      # These suites either skip on non-Windows or only exercise their real
      # branch under win32: file-context symlink/stat boundaries, clearing the
      # inherited listen-socket handle, npm tree termination, and HOME vs
      # USERPROFILE resolution. Linux CI cannot cover those paths, and none of
      # these files ran in this workflow before.
      - name: Windows-only host behavior
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\\bin\\bun.exe'
          & $bun test tests/hooks/file-context.test.ts tests/cli/adapters/shell-tilde-context.test.ts tests/shared/windows-listen-socket.test.ts tests/npm-install-windows-timeout.test.ts tests/scripts/resolve-data-dir-parity.test.ts --timeout 60000

      - name: Context reader responsiveness and packaging
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\bin\bun.exe'
          & $bun test tests/context/context-read-responsiveness.test.ts tests/context/context-read-results.test.ts tests/context/context-read-worker-lifecycle.test.ts tests/context/context-read-routes.test.ts tests/context/context-work-state-order.test.ts tests/infrastructure/context-reader-packaging.test.ts --timeout 60000

      - name: Deep search subprocess lifecycle and release artifacts
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\bin\bun.exe'
          & $bun test tests/worker/deep-search-client.test.ts tests/worker/deep-search-snapshot.test.ts tests/integration/deep-search-guard-faults.test.ts tests/integration/deep-search-process.test.ts tests/integration/deep-search-packaging.test.ts tests/integration/deep-search-release-e2e.test.ts tests/integration/context-bundle-environment.test.ts tests/integration/worker-binary-build.test.ts --timeout 120000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Covers the Windows-only bun resolver path that Linux CI skips, plus the
      # scripts that replaced rsync and tail: mirror pattern matching, --delete
      # protection and -a metadata reconciliation against real NTFS paths, and
      # the bounded log tail under a constrained heap.
      - name: Windows bun resolver and rsync-replacement scripts
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\\bin\\bun.exe'
          & $bun test tests/bun-runner.test.ts tests/scripts/mirror-dir.test.ts tests/scripts/worker-logs.test.ts --timeout 120000

      # Bun's Glob returns backslash paths on Windows. The lane split must still
      # send tests/integration and smart-file-read files to the integration lane.
      - name: Test-lane split on Windows paths
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\\bin\\bun.exe'
          & $bun test tests/scripts/test-lanes.test.ts

      # The installer's refusal boundaries: non-TTY and TTY cases that require
      # exit 1, require --runtime worker, untouched settings (mode included) and
      # zero bootstrap/HTTP/task calls. They only ran on Linux (the test-lanes
      # check gate) until the 0o600 mode assertion and fixture caps were fixed
      # for Windows; run them here so installer regressions ship unseen on no
      # lane. The Pi+DSH detection describe stays skipped (needs real installs).
      - name: Combined-installer boundary suites
        shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\\bin\\bun.exe'
          & $bun test tests/npx-cli/combined-installer-non-tty-boundaries.test.ts tests/npx-cli/combined-installer-boundaries.test.ts --timeout 30000

      # The step that used to be impossible on Windows: sync-marketplace shelled
      # out to rsync. Runs the real script against a scratch USERPROFILE (Node's
      # os.homedir() reads it on Windows) so the runner's own profile is
      # untouched, then asserts the rsync semantics it replaced — stale files
      # deleted, already-installed deps and excluded trees left alone.
      - name: Exercise marketplace sync
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $env:USERPROFILE '.bun\bin');$env:PATH"

          $scratchHome = Join-Path $env:RUNNER_TEMP 'sync-home'
          $marketplace = Join-Path $scratchHome '.claude\plugins\marketplaces\thedotmack'
          $dep = Join-Path $marketplace 'node_modules\pre-existing-dep'
          New-Item -ItemType Directory -Force -Path $dep | Out-Null
          Set-Content -Path (Join-Path $marketplace 'STALE-FROM-OLD-BUILD.js') -Value 'stale'
          Set-Content -Path (Join-Path $dep 'index.js') -Value 'installed'

          $env:USERPROFILE = $scratchHome
          node scripts/sync-marketplace.cjs

          if (-not (Test-Path (Join-Path $marketplace 'plugin\.claude-plugin\plugin.json'))) {
            throw 'sync did not populate the marketplace'
          }
          if (Test-Path (Join-Path $marketplace 'STALE-FROM-OLD-BUILD.js')) {
            throw 'sync left a stale file behind (--delete equivalence broken)'
          }
          if (-not (Test-Path (Join-Path $dep 'index.js'))) {
            throw 'sync deleted installed deps that --delete protected'
          }
          if (Test-Path (Join-Path $marketplace 'services/sync-hub')) {
            throw 'sync copied the excluded services/sync-hub tree'
          }

      # worker:logs replaced `tail -n 50` + `date +%F`, neither of which exists
      # in native PowerShell. Set-Content writes CRLF, so this also covers a
      # Windows-native line ending that the bun test (LF) does not.
      - name: Exercise worker log tail
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'log-home'
          $logs = Join-Path $env:USERPROFILE '.claude-mem\logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          Set-Content -Path (Join-Path $logs "claude-mem-$stamp.log") -Value (1..60 | ForEach-Object { "line $_" })

          $out = node scripts/worker-logs.cjs
          if ($out.Count -ne 50) { throw "expected 50 lines, got $($out.Count)" }
          if ($out[0].TrimEnd() -ne 'line 11') { throw "expected first line 'line 11', got '$($out[0])'" }
          if ($out[49].TrimEnd() -ne 'line 60') { throw "expected last line 'line 60', got '$($out[49])'" }
